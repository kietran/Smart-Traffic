name: tettet-frontend
services:
  frontend:
    container_name: tettet-frontend
    image: frontend:v1.0.0
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    volumes:
      - ../:/app
    ports:
      - "8002:5173"
    networks:
      - tettet
    tty: true
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
    command: npm run dev
networks:
  tettet:
    name: tettet
    driver: bridge
