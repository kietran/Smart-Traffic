name: tettet-frontend
services:
  frontend:
    container_name: tettet-frontend
    image: frontend:v1.0.0
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    volumes:
      # Mount source code but preserve node_modules in container
      - ../src:/app/src
      - ../public:/app/public
      - ../index.html:/app/index.html
      - ../vite.config.js:/app/vite.config.js
      - ../tailwind.config.js:/app/tailwind.config.js
      - ../postcss.config.js:/app/postcss.config.js
      - ../eslint.config.js:/app/eslint.config.js
      # Use a named volume for node_modules to persist between container restarts
      - node_modules:/app/node_modules
    ports:
      - "8002:5173"
    networks:
      - tettet
    tty: true
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"

volumes:
  node_modules:

networks:
  tettet:
    name: tettet
    driver: bridge
